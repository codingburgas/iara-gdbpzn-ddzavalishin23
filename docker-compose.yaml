services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: gdpbzn_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: gdpbzn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdpbzn_user -d gdpbzn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      RUNNING_IN_CONTAINER: 'true'
      POSTGRES_USER: gdpbzn_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: gdpbzn_db
      SECRET_KEY: 'dev-secret-key-change-in-production'
    volumes:
      - ./app:/app/app:Z
      - ./run.py:/app/run.py:Z
      - ./config.py:/app/config.py:Z
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: